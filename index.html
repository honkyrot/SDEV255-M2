<!DOCTYPE html>
    <html lang="en">
    <head>
        <title>Bootstrap Example</title>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
        </head>
    <body>
        
        <div class="container" id="main_container">
            <h1>My first bootstrap page</h1>
             <!-- 1. create alert button -->
            <div class="alert_button">
                <button type="button" class="btn btn-primary" onclick="spawnAlert()">create a bootstrap alert</button>
            </div>
            <div id="alert_container">
            </div>
            <!-- 2. image -->
             <img src="PXL_20260502_001508522.jpg" class="img-fluid" alt="Responsive image">

             <div class="mt-4 p-5 bg-primary text-white rounded">
                <h1>I got the above image from a park!</h1>
                <p>I like parks</p>
            </div>
        </div>
       

    </body>
    <script>
        function spawnAlert() {
            text = timestamp = new Date().toLocaleString();
            alertDiv = document.createElement("div");
            alertDiv.className = "alert alert-success alert-dismissible fade show";
            alertDiv.role = "alert";
            alertDiv.innerHTML = text + '<button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>';
            alert_container = document.getElementById("alert_container");
            alert_container.appendChild(alertDiv);

        }
    </script>
</html>
